interface=wlan0
driver=nl80211
ctrl_interface=/run/hostapd

# Bring-up default only: provision a unique SSID and PSK per production unit.
ssid=MangoPi-Setup
country_code=CN
ieee80211d=1
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1
max_num_sta=8
ap_isolate=1

auth_algs=1
wpa=2
wpa_passphrase=mangopi8800
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
