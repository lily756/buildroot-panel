interface=wlan0
bind-interfaces
no-resolv
no-hosts
domain-needed
bogus-priv
dhcp-authoritative

dhcp-range=192.168.4.10,192.168.4.100,255.255.255.0,10m
dhcp-option=3,192.168.4.1
dhcp-option=6,192.168.4.1
dhcp-option=114,http://192.168.4.1/
dhcp-leasefile=/run/dnsmasq-ap.leases
pid-file=/run/dnsmasq-ap.pid

# Resolve every hostname to the local portal while provisioning is active.
address=/#/192.168.4.1
